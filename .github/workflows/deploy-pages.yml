# Build Vite app and publish to GitHub Pages (enable: Settings → Pages → Source: GitHub Actions).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` fails if the lockfile was produced on another OS and omits
      # optional/native deps (e.g. @emnapi/* on Linux). `npm install` resolves
      # the tree on the runner and matches package.json + lockfile semantics.
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
